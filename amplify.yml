version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun install
        - echo "DATABASE_URL=${DATABASE_URL}" >> .env
        - echo "NEXON_USER_ADDRESS=${NEXON_USER_ADDRESS}" >> .env
        - echo "HYPERLIQUID_NETWORK=${HYPERLIQUID_NETWORK}" >> .env
        - echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> .env
        - echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> .env
        - echo "AWS_REGION=${AWS_REGION}" >> .env
        - echo "KMS_KEY_ID=${KMS_KEY_ID}" >> .env
        - echo "FIB_SSO_CLIENT_ID=${FIB_SSO_CLIENT_ID}" >> .env
        - echo "FIB_SSO_CLIENT_SECRET=${FIB_SSO_CLIENT_SECRET}" >> .env
        - echo "FIB_ENV=${FIB_ENV}" >> .env
    build:
      commands:
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .bun/install/cache/**/* # optional cache if using Bun cache
